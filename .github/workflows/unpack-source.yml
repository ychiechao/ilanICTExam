name: Unpack source bundle

on:
  push:
    branches:
      - main
    paths:
      - source.zip.b64.part*
      - .github/workflows/unpack-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify bundle
        shell: bash
        run: |
          set -euo pipefail
          cat source.zip.b64.part1 source.zip.b64.part2 source.zip.b64.part3 source.zip.b64.part4 | tr -d '\r\n' > source.zip.b64
          base64 -d source.zip.b64 > source.zip
          echo "41f95e39106459ece6cf178d347237e20c8544942eaabaaeccbe4be736c52673  source.zip" | sha256sum -c -

      - name: Expand project files
        shell: bash
        run: |
          set -euo pipefail
          mkdir unpacked
          unzip -q source.zip -d unpacked
          shopt -s dotglob
          cp -R unpacked/* .
          rm -rf unpacked source.zip source.zip.b64 source.zip.b64.part* .gitkeep .github/workflows/unpack-source.yml

      - name: Commit expanded project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add ilanICTExam source"
          git push
